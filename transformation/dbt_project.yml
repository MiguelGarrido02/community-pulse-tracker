name: 'community_pulse'
version: '1.0.0'
config-version: 2

# this name must match a profile in your profiles.yml
profile: 'community_pulse_profile'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  community_pulse:
    # default materialization for all models in this project
    +materialized: view
    +snowflake_warehouse: community_pulse_wh